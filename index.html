<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система учёта оборудования</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="equipment">
    <header class="equipment__header">
	<h1 class="equipment__title">
	Система учёта оборудования
        </h1>

</header>
        <section class="equipment__add">
	
	<h2 class="equipment__subtitle">
        Добавить оборудование
        </h2>
        
	<form class="equipment-form">
        <input 
        class="equipment-form__input"
        type="text"
        placeholder="Введите название">

        <select class="equipment-form__select">

        <option>
        Ноутбук
        </option>
	<option>
        Монитор
        </option>

        <option>
        Проектор
        </option>
</select>

        <select class="equipment-form__select">

        <option>
        Работает
        </option>

        <option>
        Сломано
        </option>

</select>

        <button class="equipment-form__button">
        Добавить
        </button>

        </form>

</section>

        <section class="equipment__list">
        <h2 class="equipment__subtitle">
        Список оборудования
        </h2>
        <div class="equipment-filters">
        <select class="equipment-filters__select">

        <option>
        Все категории
        </option>
	<option>
	Ноутбук
	</option>
	<option>
	Монитор
	</option>
	<option>
	Проектор
	</option>

</select>
        <select class="equipment-filters__select">

        <option>
        Все статусы
        </option>
	<option>
	Работает
	</option>
	<option>
	Сломано
	</option>

        </select>

</div>

        <table class="equipment-table">
	<thead>
        <tr>

        <th>Название</th>
        <th>Категория</th>
        <th>Статус</th>
        <th>Действия</th>

        </tr>

</thead>

        <tbody>

        <tr>

        <td>Ноутбук Dell</td>
        <td>Ноутбук</td>
        <td>Работает</td>

        <td>
        <button class="equipment-table__delete">

        Удалить
	</button>
	</td>
	</tr>
	</tbody>
	</table>
	</section>

</main>

<script src="JavaScript/script.js"></script>

</body>

</html>
